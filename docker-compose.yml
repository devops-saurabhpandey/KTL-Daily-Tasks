services:
  app:
    build: .
    container_name: ktl-daily-tasks-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MONGODB_URI: "mongodb://mongo:27017"
      MONGODB_DB: "ktl_daily_tasks"
      # WhatsApp Cloud API settings can be added locally in .env if needed.
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_RC_TEMPLATE_NAME: ${WHATSAPP_RC_TEMPLATE_NAME:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      WHATSAPP_RC_TEMPLATE_LANGUAGE: ${WHATSAPP_RC_TEMPLATE_LANGUAGE:-en}
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    container_name: ktl-daily-tasks-db
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - ktl_mongo_data:/data/db
    # Intentionally not published to the internet/host port.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ktl_mongo_data:
