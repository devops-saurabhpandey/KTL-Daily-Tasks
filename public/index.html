<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KTL Daily Tasks</title>
<style>
:root{font-family:Arial,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#123b68;color:white;padding:22px 16px}.wrap{max-width:1100px;margin:auto}.top h1{margin:0 0 6px;font-size:25px}.top p{margin:0;opacity:.85}.main{max-width:1100px;margin:20px auto;padding:0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 10px #152b4810}.stat strong{display:block;font-size:25px;margin-top:6px}.panel h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,button{width:100%;padding:11px;border:1px solid #ccd5e2;border-radius:8px;font-size:15px;background:white}button{background:#1769aa;color:white;border:0;font-weight:700;cursor:pointer}button.secondary{background:#e7eef7;color:#123b68}.actions{display:flex;gap:10px;margin-top:14px}.actions button{width:auto}.search{margin:16px 0}.task{border:1px solid #e0e7f0;border-radius:10px;padding:13px;margin-top:10px}.task-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.task h3{margin:0 0 7px;font-size:16px}.muted{color:#667085;font-size:13px;line-height:1.6}.statuses{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.statuses label{font-weight:400;display:flex;align-items:center;gap:6px}.statuses select{width:auto;padding:7px}.empty{color:#667085;padding:18px 0}.error{color:#b42318;margin-top:10px}.ok{color:#067647;margin-top:10px}@media(max-width:620px){.grid,.stats{grid-template-columns:1fr}.main{margin-top:12px}.top h1{font-size:22px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header class="top"><div class="wrap"><h1>KTL Daily Tasks</h1><p>Customer vehicle documents and delivery follow-up</p></div></header>
<main class="main">
<section class="stats">
<div class="stat">Total Tasks<strong id="total">0</strong></div>
<div class="stat">Number Plate Pending<strong id="platePending">0</strong></div>
<div class="stat">RC Pending<strong id="rcPending">0</strong></div>
</section>
<section class="panel">
<h2 id="formTitle">Add Customer Task</h2>
<form id="taskForm">
<input type="hidden" id="taskId">
<div class="grid">
<div><label for="customerName">Customer Name *</label><input id="customerName" required maxlength="120" placeholder="Enter customer name"></div>
<div><label for="outlet">Outlet *</label><select id="outlet" required><option value="">Select outlet</option><option>Ramadevi</option><option>Chunniganj</option><option>Keshav Nagar</option><option>Kannauj</option><option>Shivraj pur</option><option>Bilhaur</option><option>Unnao</option><option>Fatehpur</option></select></div>
<div><label for="taskDate">Task Date (DD-MM-YYYY)</label><input id="taskDate" type="date" required></div>
<div><label for="phone">Phone Number</label><input id="phone" inputmode="tel" maxlength="20" placeholder="Enter phone number"></div>
<div><label for="chassisNumber">Chassis Number</label><input id="chassisNumber" maxlength="80" placeholder="Enter chassis number"></div>
<div><label for="engineNumber">Engine Number</label><input id="engineNumber" maxlength="80" placeholder="Enter engine number"></div>
<div><label for="vehicleNumber">Vehicle Number</label><input id="vehicleNumber" maxlength="30" placeholder="e.g. UP78 AB 1234"></div>
<div><label for="taxAmount">Tax Amount (₹)</label><input id="taxAmount" type="number" min="0" step="0.01" value="0" placeholder="Enter tax amount"></div>
<div><label for="penalty">Penalty (₹)</label><input id="penalty" type="number" min="0" step="0.01" value="0" placeholder="Enter penalty"></div>
<div><label for="numberPlateStatus">Number Plate Received</label><select id="numberPlateStatus"><option>Pending</option><option>Received</option></select></div>
<div><label for="rcStatus">RC Received by Customer</label><select id="rcStatus"><option>Pending</option><option>Received</option></select></div>
</div>
<div class="actions"><button type="submit" id="saveBtn">Save Task</button><button type="button" class="secondary" id="cancelBtn" hidden>Cancel Edit</button></div>
<div id="message" role="status"></div>
</form>
</section>
<section class="panel" style="margin-top:16px"><h2>Customer Tasks</h2><input class="search" id="search" placeholder="Search customer, phone, chassis, engine or vehicle number"><div class="actions" style="margin-top:0;margin-bottom:12px;flex-wrap:wrap"><button type="button" id="exportCsv" class="secondary">Export CSV</button><button type="button" id="exportExcel" class="secondary">Export Excel (.xlsx)</button></div><div id="tasks"><p class="empty">Loading tasks…</p></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let items=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
function updateStats(){ $("total").textContent=items.length;$("platePending").textContent=items.filter(x=>x.numberPlateStatus!=="Received").length;$("rcPending").textContent=items.filter(x=>x.rcStatus!=="Received").length;}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const filtered=items.filter(x=>[x.customerName,x.outlet,x.phone,x.chassisNumber,x.engineNumber,x.vehicleNumber].some(v=>String(v||"").toLowerCase().includes(q)));
  $("tasks").innerHTML=filtered.length?filtered.map(x=>'<article class="task"><div class="task-head"><div><h3>'+esc(x.customerName)+'</h3><div class="muted">Date: '+esc(x.taskDate?new Date(x.taskDate).toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}):"—")+'<br>Phone: '+esc(x.phone||"—")+'<br>Vehicle: '+esc(x.vehicleNumber||"—")+'<br>Chassis: '+esc(x.chassisNumber||"—")+'<br>Engine: '+esc(x.engineNumber||"—")+'</div></div><button type="button" class="secondary" onclick="editTask(\''+x._id+'\')">Edit</button></div><div class="statuses"><label>Number Plate <select onchange="setStatus(\''+x._id+'\',\'numberPlateStatus\',this.value)"><option '+(x.numberPlateStatus==="Pending"?"selected":"")+'>Pending</option><option '+(x.numberPlateStatus==="Received"?"selected":"")+'>Received</option></select></label><label>Customer RC <select onchange="setStatus(\''+x._id+'\',\'rcStatus\',this.value)"><option '+(x.rcStatus==="Pending"?"selected":"")+' >Pending</option><option '+(x.rcStatus==="Received"?"selected":"")+' >Received</option></select></label></div><div class="muted">Created: '+esc(x.createdAt?new Date(x.createdAt).toLocaleDateString():"—")+'</div></article>').join(""):'<p class="empty">No tasks found. Add a customer task above.</p>';
  updateStats();
}
async function load(){try{items=await api("/api/tasks");render()}catch(e){$("tasks").innerHTML='<p class="error">'+esc(e.message)+'</p>';updateStats()}}
$("taskForm").addEventListener("submit",async e=>{e.preventDefault();$("message").textContent="Saving…";$("message").className="";const id=$("taskId").value;const body={taskDate:$("taskDate").value,customerName:$("customerName").value,outlet:$("outlet").value,taxAmount:Number($("taxAmount").value||0),penalty:Number($("penalty").value||0),phone:$("phone").value,chassisNumber:$("chassisNumber").value,engineNumber:$("engineNumber").value,vehicleNumber:$("vehicleNumber").value,numberPlateStatus:$("numberPlateStatus").value,rcStatus:$("rcStatus").value};try{await api(id?"/api/tasks/"+encodeURIComponent(id):"/api/tasks",{method:id?"PATCH":"POST",body:JSON.stringify(body)});$("message").textContent="Task saved successfully."; $("message").className="ok";resetForm();await load()}catch(err){$("message").textContent=err.message;$("message").className="error"}});
function exportRows(){const q=$("search").value.trim().toLowerCase();return items.filter(x=>[x.customerName,x.outlet,x.phone,x.chassisNumber,x.engineNumber,x.vehicleNumber].some(v=>String(v||"").toLowerCase().includes(q))).map(x=>({"Task Date":x.taskDate?new Date(x.taskDate).toLocaleDateString("en-GB"):"","Customer Name":x.customerName||"","Outlet":x.outlet||"","Tax Amount (₹)":Number(x.taxAmount||0),"Penalty (₹)":Number(x.penalty||0),"Phone Number":x.phone||"","Chassis Number":x.chassisNumber||"","Engine Number":x.engineNumber||"","Vehicle Number":x.vehicleNumber||"","Number Plate Received":x.numberPlateStatus||"Pending","RC Received by Customer":x.rcStatus||"Pending","Created Date":x.createdAt?new Date(x.createdAt).toLocaleDateString("en-GB"):""}))}
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCsv(){const rows=exportRows();if(!rows.length){alert("No tasks to export.");return}const keys=Object.keys(rows[0]);const csv=[keys,...rows.map(r=>keys.map(k=>r[k]))].map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\\r\\n");downloadBlob(new Blob(["\\uFEFF",csv],{type:"text/csv;charset=utf-8;"}),"ktl-daily-tasks.csv")}
function exportExcel(){const rows=exportRows();if(!rows.length){alert("No tasks to export.");return}if(!window.XLSX){alert("Excel export library could not load. Please use Export CSV.");return}const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Customer Tasks");XLSX.writeFile(wb,"ktl-daily-tasks.xlsx")}
$("exportCsv").addEventListener("click",exportCsv);$("exportExcel").addEventListener("click",exportExcel);\nfunction resetForm(){$("taskForm").reset();$("taskDate").value=new Date().toLocaleDateString("en-CA");$("taskId").value="";$("formTitle").textContent="Add Customer Task";$("saveBtn").textContent="Save Task";$("cancelBtn").hidden=true}
window.editTask=id=>{const x=items.find(i=>i._id===id);if(!x)return;$("taskId").value=x._id;if(x.taskDate){const d=new Date(x.taskDate);$("taskDate").value=d.toISOString().slice(0,10)}else{$("taskDate").value=new Date().toISOString().slice(0,10)}for(const k of ["customerName","outlet","taxAmount","penalty","phone","chassisNumber","engineNumber","vehicleNumber","numberPlateStatus","rcStatus"])$(k).value=x[k]|| (k.endsWith("Status")?"Pending":"");$("formTitle").textContent="Edit Customer Task";$("saveBtn").textContent="Update Task";$("cancelBtn").hidden=false;window.scrollTo({top:0,behavior:"smooth"})};
window.setStatus=async(id,key,value)=>{try{await api("/api/tasks/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({[key]:value})});await load()}catch(e){alert(e.message);await load()}};
$("cancelBtn").addEventListener("click",resetForm);$("taskDate").value=new Date().toISOString().slice(0,10);$("search").addEventListener("input",render);load();
</script>
</body></html>
